<style>
[hidden] { display: none !important; }
html, body { margin: 0; }
/* Layout: editorial storefront. Full-bleed split hero, zero-gutter product grids with hairlines, cream canvas, one pink accent. Single light look by choice. */
:root {
  --canvas: #F3EEE8;
  --paper: #FAF7F3;
  --ink: #1C1717;
  --muted: #6A6260;
  --hair: rgba(28, 23, 23, 0.14);
  --pink: #EF5370;
  --pink-ink: #B8235A;
  --blush: #F9E1E9;
  --stone: #E6DED4;
  --stone-2: #D8CEC3;
  --night: #1C1717;
  --on-night: #F3EEE8;
  --on-night-muted: #BDB3AE;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --bar-h: 68px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--canvas); color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
img { max-width: 100%; display: block; }
a { color: var(--pink-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pink-ink); outline-offset: 3px; }
h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }

.label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.5; }
.muted { color: var(--muted); }
.wrap { padding-left: var(--gut); padding-right: var(--gut-r); }
@media (min-width: 900px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* Announcement + header */
.announce { background: var(--blush); padding-block: 10px; display: flex; justify-content: center; gap: 14px; text-align: center; flex-wrap: wrap; }
.announce a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--ink); height: var(--bar-h); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.bar nav { display: flex; gap: 28px; }
.bar .right { display: flex; gap: 24px; justify-content: flex-end; align-items: center; }
.navlink { background: none; border: 0; padding: 12px 0; cursor: pointer; color: var(--ink); font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.navlink:hover, .navlink[aria-current="page"] { color: var(--pink-ink); }
.brand { display: inline-flex; align-items: center; justify-content: center; width: 120px; height: 44px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand img { height: 30px; width: auto; transition: opacity .15s; }
.bar .menu-btn { display: none; }
.bar .right .navlink { white-space: nowrap; }
@media (max-width: 860px) {
  .bar nav, .bar .hide-sm { display: none; }
  .bar .menu-btn { display: inline-flex; justify-self: start; margin-left: -10px; }
  .bar .right { gap: 0; }
}
.drawer-menu { position: fixed; z-index: 40; inset: 0; background: var(--paper); padding-top: calc(env(safe-area-inset-top, 0px) + 24px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; flex-direction: column; gap: 8px; }
.drawer-menu .big { font-size: 40px; line-height: 1.15; background: none; border: 0; text-align: left; padding: 6px 0; cursor: pointer; color: var(--ink); }
.drawer-menu .big:hover { color: var(--pink-ink); }

/* Hero */
.hero { position: relative; }
.hero-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.half { position: relative; height: 860px; overflow: hidden; display: block; color: var(--on-night); }
.half img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.half:hover img { transform: scale(1.025); }
.half .label { position: absolute; top: 20px; left: 20px; color: var(--on-night); }
.half:hover { text-decoration: none; }
#mark { position: absolute; left: 50%; top: 50%; width: clamp(280px, 64vw, 940px); margin: 0; pointer-events: none; z-index: 25; transform: translate(-50%, -50%); transform-origin: 50% 50%; will-change: transform; }
#mark img { width: 100%; height: auto; }
.hero .cta { position: absolute; left: 24px; bottom: 28px; z-index: 5; }
@media (max-width: 860px) {
  .hero-grid { grid-template-columns: minmax(0, 1fr); }
  .half { height: 520px; }
}

/* Buttons */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 26px; border-radius: 41px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 17px; cursor: pointer; transition: background .2s, color .2s; text-decoration: none; }
.pill:hover { background: var(--ink); color: var(--paper); text-decoration: none; }
.pill.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pill.solid:hover { background: var(--pink-ink); border-color: var(--pink-ink); }
.pill[disabled] { opacity: .45; cursor: not-allowed; }
.link-arrow { background: none; border: 0; padding: 0; cursor: pointer; color: var(--pink-ink); font-size: 18px; }
.link-arrow:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Section heads */
.head { padding-block: 112px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; }
.head .t { display: flex; flex-direction: column; gap: 18px; max-width: 760px; }
.h2 { font-size: clamp(34px, 4.2vw, 58px); line-height: 1.05; }

/* Product grid */
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.cell { display: flex; flex-direction: column; background: none; border: 0; border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding: 0; text-align: left; cursor: pointer; color: var(--ink); min-width: 0; }
.grid4 > .cell:nth-child(4n) { border-right: 0; }
.grid4 > .cell:nth-last-child(-n+4) { border-bottom: 0; }
.cell .ph { aspect-ratio: 3 / 4; max-width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.cell .ph img { width: 100%; height: 100%; object-fit: contain; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.cell:hover .ph img { transform: translateY(-6px) scale(1.02); }
.cell .cap { padding: 0 20px 24px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 19px; }
.cell .cap .label { color: var(--muted); white-space: nowrap; }
@media (max-width: 860px) {
  .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid4 > .cell { border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .grid4 > .cell:nth-child(2n) { border-right: 0; }
  .grid4 > .cell:nth-last-child(-n+2) { border-bottom: 0; }
  .cell .cap { padding: 0 12px 18px; font-size: 16px; flex-direction: column; gap: 2px; }
}

.made-wide { grid-column: span 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 24px; background: var(--blush); border: 0; border-left: 1px solid var(--hair); padding: 32px clamp(20px, 2vw, 32px); text-align: left; cursor: pointer; color: var(--ink); min-width: 0; }
.grid4.all { border-bottom: 0; }
.grid4.all > .cell { border-bottom: 1px solid var(--hair); }
.made-wide img { width: clamp(90px, 9vw, 150px); height: auto; flex-shrink: 0; }
.made-wide .big { font-size: clamp(24px, 2.2vw, 34px); line-height: 1.1; }
.made-wide .go { color: var(--pink-ink); font-size: 18px; }
.made-wide:hover .go { text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 860px) { .made-wide { grid-column: span 1; flex-direction: column; align-items: flex-start; padding: 24px 16px; border-left: 0; } .made-wide .big { font-size: 22px; } }

/* Concha carousel */
.car-head { padding-block: 112px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; }
.car-nav { display: flex; gap: 8px; }
.arrow { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--ink); background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); transition: background .2s, color .2s; }
.arrow:hover:not([disabled]) { background: var(--ink); color: var(--paper); }
.arrow[disabled] { opacity: .3; cursor: default; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: calc(100% / 4); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); overscroll-behavior-x: contain; }
.track::-webkit-scrollbar { display: none; }
.track > * { scroll-snap-align: start; }
.track .cell { border-bottom: 0; }
.cell .ph img.cover { object-fit: cover; }
.track .edit { position: relative; display: flex; flex-direction: column; border-right: 1px solid var(--hair); min-width: 0; }
.track .edit .ph { aspect-ratio: 3 / 4; max-width: 100%; overflow: hidden; }
.track .edit .ph img { width: 100%; height: 100%; object-fit: cover; }
.track .edit.camp .ph { aspect-ratio: auto; height: 100%; }
.track .made { display: flex; flex-direction: column; justify-content: space-between; gap: 24px; background: var(--blush); color: var(--ink); border: 0; text-align: left; cursor: pointer; padding: 28px 24px 32px; min-width: 0; }
.track .made img { width: 120px; height: auto; }
.track .made p { font-size: clamp(26px, 2.4vw, 36px); line-height: 1.1; }
.track .made .go { color: var(--pink-ink); font-size: 18px; }
.track .made:hover .go { text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 860px) { .track { grid-auto-columns: 72%; } .car-head { padding-block: 72px 28px; } }

/* Models index */
.models { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 64px; row-gap: 28px; padding-block: 120px 168px; align-items: stretch; }
.models > .label { grid-column: 1 / -1; }
.mlist { display: flex; flex-direction: column; }
.mitem { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border: 0; border-top: 1px solid var(--ink); background: none; text-align: left; cursor: pointer; color: var(--muted); font-size: clamp(30px, 3.2vw, 44px); line-height: 1.1; font-family: var(--serif); }
.mitem:last-child { border-bottom: 1px solid var(--ink); }
.mitem[aria-pressed="true"] { color: var(--ink); font-style: italic; }
.mitem[aria-pressed="true"] .label { color: var(--pink-ink); font-style: normal; }
.mitem .label { color: inherit; }
.mfig { margin: 0; position: relative; min-height: 0; display: flex; flex-direction: column; align-items: flex-start; }
.mfig .frame { position: absolute; top: 0; left: 0; bottom: 0; height: 100%; aspect-ratio: 1 / 1; max-width: 100%; overflow: hidden; background: var(--stone); display: flex; align-items: center; justify-content: center; }
.mfig figcaption { position: absolute; top: 100%; left: 0; width: 100%; padding-top: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 17px; }
@keyframes idxIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.mfig .frame > img { animation: idxIn .45s cubic-bezier(.2,.7,.2,1) both; }
@media (prefers-reduced-motion: reduce) { .mfig .frame > img { animation: none; } }
.mfig .frame > img { width: 100%; height: 100%; }
.mfig .frame img.contain { object-fit: contain; }
.mfig .frame img.cover { object-fit: cover; }
.mfig .soon { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding: 24px; }
.mfig .soon img { width: 120px; height: auto; }
@media (max-width: 860px) { .models { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 72px; } .mfig .frame { position: relative; height: auto; width: 100%; } .mfig figcaption { position: static; } }

/* Personalizar band */
.band { background: var(--blush); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pstack { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); min-height: 760px; background: var(--canvas); }
.pstack figure { position: relative; margin: 0; overflow: hidden; background: #F1EAE2; }
.pstack figure + figure { border-top: 1px solid var(--hair); }
.pstack img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.pstack figure:hover img { transform: scale(1.03); }
.pstack figcaption { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; gap: 12px; color: var(--ink); }
@media (max-width: 860px) { .pstack { min-height: 0; grid-template-rows: none; } .pstack figure { aspect-ratio: 3 / 2; max-width: 100%; } }
@media (prefers-reduced-motion: reduce) { .pstack img { transition: none; } }
.band .txt { padding-block: 96px; display: flex; flex-direction: column; justify-content: center; gap: 28px; max-width: 640px; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; gap: 24px; padding: 12px 0; border-top: 1px solid var(--ink); }
.steps li:last-child { border-bottom: 1px solid var(--ink); }
.steps li span:first-child { color: var(--pink-ink); }
@media (max-width: 860px) { .band { grid-template-columns: minmax(0, 1fr); } .band .txt { padding-block: 56px; } }

/* Quote + gallery */
.quote { padding-block: 140px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }
.quote p.big { max-width: 980px; font-size: clamp(30px, 4vw, 58px); line-height: 1.12; letter-spacing: -0.01em; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
.tile { aspect-ratio: 4 / 5; max-width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.tile img.cover { width: 100%; height: 100%; object-fit: cover; }
.tile img.contain { width: 86%; height: 86%; object-fit: contain; }
@media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tiles .tile:nth-child(5) { display: none; } }

/* Footer */
footer { --night: #FDF2F4; --on-night: var(--ink); --on-night-muted: var(--muted); border-top: 1px solid var(--hair); background: var(--night); color: var(--on-night); padding-block: 80px 28px; display: flex; flex-direction: column; gap: 64px; }
footer a, footer .flink { color: var(--on-night); background: none; border: 0; padding: 4px 0; cursor: pointer; text-align: left; font-size: 17px; font-family: var(--serif); }
footer a:hover, footer .flink:hover { color: var(--pink-ink); text-decoration: none; }
.fcols { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; }
.fcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fcol .label { color: var(--on-night-muted); margin-bottom: 8px; }
.news { display: flex; border-bottom: 1px solid var(--on-night); max-width: 380px; }
.news input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--on-night); font: inherit; padding: 12px 0; }
.news input::placeholder { color: var(--on-night-muted); }
.news input:focus-visible { outline: none; }
.news:focus-within { border-bottom-color: var(--pink-ink); }
.news button { background: none; border: 0; color: var(--on-night); cursor: pointer; min-height: 44px; }
.fmark { width: 100%; height: auto; }
.fbase { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; color: var(--on-night-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 860px) { .fcols { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fcol.wide { grid-column: 1 / -1; } }

/* Product view */
.pdp { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); border-bottom: 1px solid var(--hair); }
.pgal { border-right: 1px solid var(--hair); display: flex; flex-direction: column; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); align-self: start; }
.pmain { height: clamp(420px, calc(100svh - var(--bar-h) - 113px), 860px); max-width: 100%; background: var(--stone); display: flex; align-items: center; justify-content: center; overflow: hidden; padding: clamp(16px, 3vw, 48px); }
.pmain img { width: 100%; height: 100%; object-fit: contain; animation: idxIn .45s cubic-bezier(.2,.7,.2,1) both; }
@media (prefers-reduced-motion: reduce) { .pmain img { animation: none; } }
.pdp.multi .pgal { position: static; }
.pdp.multi .pmain { position: relative; height: auto; aspect-ratio: 1 / 1; }
.pdp.multi .pmain.full { aspect-ratio: 4 / 5; padding: clamp(16px, 3vw, 48px) 0 clamp(16px, 3vw, 48px) clamp(16px, 3vw, 48px); }
.pdp.multi .pmain.full img { object-position: right center; }
.pdp.multi .pmain + .pmain { border-top: 1px solid var(--hair); }
.pdp.multi .pinfo { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); align-self: start; }
.pview { position: absolute; top: 20px; left: 20px; color: var(--muted); }
@media (max-width: 860px) { .pdp.multi .pinfo { position: static; } }
.pthumbs { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); border-top: 1px solid var(--hair); }
.pthumb { height: 112px; max-width: 100%; border: 0; border-right: 1px solid var(--hair); background: var(--canvas); padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.pthumb:last-child { border-right: 0; }
.pthumb img { width: 78%; height: 78%; object-fit: contain; }
.pthumb[aria-pressed="true"] { background: var(--stone); }
.pinfo { padding-block: 48px 64px; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.crumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); }
.crumbs button:hover { color: var(--pink-ink); }
.ptitle { font-size: clamp(44px, 4.6vw, 68px); line-height: 1; }
.sw-row { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 48px; height: 48px; border-radius: 50%; border: 1px solid transparent; background: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.sw span { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--ink); display: block; }
.sw[aria-pressed="true"] { border-color: var(--ink); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--ink); border-radius: 41px; height: 48px; }
.qty button { width: 44px; height: 46px; background: none; border: 0; cursor: pointer; font-size: 20px; }
.qty output { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.buyrow { display: flex; gap: 12px; flex-wrap: wrap; }
.buyrow .pill.solid { flex: 1; min-width: 200px; }
details { border-bottom: 1px solid var(--ink); }
details summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-height: 52px; }
details summary::-webkit-details-marker { display: none; }
details .plus { font-family: var(--serif); font-size: 20px; transition: transform .2s; }
details[open] .plus { transform: rotate(45deg); }
details p { padding-bottom: 18px; font-size: 17px; }
.acc { border-top: 1px solid var(--ink); }
@media (max-width: 860px) { .pdp { grid-template-columns: minmax(0, 1fr); } .pgal { border-right: 0; position: static; } .pmain { height: auto; aspect-ratio: 4 / 5; } .pthumb { height: 84px; } .pinfo { padding-block: 32px 48px; } }

/* Builder */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.bprev { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); align-self: start; background: var(--stone); min-height: calc(100svh - var(--bar-h)); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; padding: 64px 32px 40px; }
.bprev-tag { position: absolute; top: 20px; left: 20px; }

  var barLogo = document.getElementById('barLogo'), bar = document.getElementById('bar');
  function setupMark() {
    markEl = document.getElementById('mark');
    heroEl = document.getElementById('hero');
    d0 = 0;
    if (!markEl) { barLogo.style.opacity = '1'; return; }
    updateMark();
  }
  function updateMark() {
    raf = 0;
    if (!markEl || !heroEl) return;
    var hr = heroEl.getBoundingClientRect(), br = bar.getBoundingClientRect();
    var dist = (hr.top + hr.height / 2) - (br.top + br.height / 2);
    if (!d0 || dist > d0) d0 = Math.max(1, dist);
    var docked = dist <= 0.5;
    var p = Math.min(1, Math.max(0, 1 - dist / d0));
    var k = 120 / Math.max(1, markEl.offsetWidth);
    var sc = reduce ? 1 : 1 - p * (1 - k);
    markEl.style.transform = 'translate(-50%, -50%) scale(' + sc.toFixed(4) + ')';
    markEl.style.opacity = docked ? '0' : '1';
    barLogo.style.opacity = docked ? '1' : '0';
  }
  window.addEventListener('scroll', function () { if (!raf) raf = requestAnimationFrame(updateMark); }, { passive: true });
  window.addEventListener('resize', function () { d0 = 0; if (!raf) raf = requestAnimationFrame(updateMark); });

  /* Carousel arrows */
  var carTimer = 0, carObs = null;
  function setupCarousel() {
    clearInterval(carTimer); carTimer = 0;
    if (carObs) { carObs.disconnect(); carObs = null; }
    var tr = document.getElementById('track'), pv = document.getElementById('carPrev'), nx = document.getElementById('carNext');
    if (!tr) return;
    var paused = false, visible = true, idle = 0;
    function step() { var c = tr.firstElementChild; return c ? c.getBoundingClientRect().width : tr.clientWidth; }
    function atEnd() { return tr.scrollLeft + tr.clientWidth >= tr.scrollWidth - 2; }
    function sync() { pv.disabled = tr.scrollLeft <= 2; nx.disabled = false; }
    function move(dir) {
      if (dir > 0 && atEnd()) tr.scrollTo({ left: 0, behavior: reduce ? 'auto' : 'smooth' });
      else if (dir < 0 && tr.scrollLeft <= 2) tr.scrollTo({ left: tr.scrollWidth, behavior: reduce ? 'auto' : 'smooth' });
      else tr.scrollBy({ left: dir * step(), behavior: reduce ? 'auto' : 'smooth' });
    }
    function nudge() { idle = Date.now(); }
    pv.onclick = function () { nudge(); move(-1); };
    nx.onclick = function () { nudge(); move(1); };
    tr.addEventListener('scroll', function () { requestAnimationFrame(sync); }, { passive: true });
    tr.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') { e.preventDefault(); nx.onclick(); } if (e.key === 'ArrowLeft') { e.preventDefault(); pv.onclick(); } });
    ['mouseenter', 'focusin', 'touchstart'].forEach(function (ev) { tr.addEventListener(ev, function () { paused = true; }, { passive: true }); });
    ['mouseleave', 'focusout', 'touchend'].forEach(function (ev) { tr.addEventListener(ev, function () { paused = false; nudge(); }, { passive: true }); });
    if ('IntersectionObserver' in window) { carObs = new IntersectionObserver(function (es) { visible = es[0].isIntersecting; }, { threshold: 0.3 }); carObs.observe(tr); }
    sync();
    if (reduce) return;
    carTimer = setInterval(function () {
      if (paused || !visible || document.hidden || Date.now() - idle < 5000) return;
      move(1);
    }, 3200);
  }

  /* Cart */
  var cartEl = document.getElementById('cart'), scrim = document.getElementById('scrim');
  function saveCart() { try { localStorage.setItem('luli-cart', JSON.stringify(cart)); } catch (e) {} }
  function cartCount() { return cart.reduce(function (n, i) { return n + i.qty; }, 0); }
  function renderCart() {
    document.getElementById('cartCount').textContent = cartCount();
    var items = document.getElementById('cartItems'), foot = document.getElementById('cartFoot');
    if (!cart.length) {
      items.innerHTML = '<div class="empty"><p style="font-size: 26px">Sua sacola está vazia.</p><p class="muted">Escolha um modelo pronto ou monte o seu no Personalizar.</p><button class="pill" data-go="home" data-scroll="todos" data-close-cart>Ver modelos →</button></div>';
      foot.innerHTML = '';
      return;
    }
    items.innerHTML = cart.map(function (it, i) {
      return '<div class="citem"><div class="th"><img src="' + sm(it.img) + '" alt="" loading="lazy" decoding="async"></div><div class="meta"><span style="font-size: 19px">' + esc(it.title) + '</span><span class="muted" style="font-size: 15px">' + esc(it.sub) + '</span><span class="label muted">' + brl(priceOf(it) * it.qty) + '</span>' +
        '<div class="row"><div class="qty" role="group" aria-label="Quantidade de ' + esc(it.title) + '"><button data-cq="' + i + ':-1" aria-label="Diminuir">−</button><output>' + it.qty + '</output><button data-cq="' + i + ':1" aria-label="Aumentar">+</button></div><button class="rm" data-rm="' + i + '">Remover</button></div></div></div>';
    }).join('');
    foot.innerHTML = '<div style="display: flex; justify-content: space-between"><span class="label">Subtotal · ' + cartCount() + (cartCount() === 1 ? ' peça' : ' peças') + '</span><span class="label">' + brl(cart.reduce(function (t, i) { return t + priceOf(i) * i.qty; }, 0)) + '</span></div>' +
      '<a class="pill solid wa" href="https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(cartMessage()) + '" target="_blank" rel="noopener">' + WA_ICON + 'Finalizar compra pelo WhatsApp</a><p class="label muted" style="line-height: 1.7">O pedido abre uma conversa no WhatsApp com a Luli, onde você combina frete e pagamento.</p>';
  }
  function cartMessage() {
    var total = cart.reduce(function (t, i) { return t + priceOf(i) * i.qty; }, 0);
    return 'Oi, tudo bem? Quero finalizar meu pedido:\n' + cart.map(function (it) { return '• ' + it.qty + 'x ' + it.title + ' · ' + brl(priceOf(it) * it.qty); }).join('\n') + '\nSubtotal: ' + brl(total);
  }
  function openCart() { renderCart(); cartEl.hidden = false; scrim.hidden = false; document.getElementById('cartClose').focus(); }
  function closeCart() { cartEl.hidden = true; scrim.hidden = true; }
  function addItem(item) {
    for (var i = 0; i < cart.length; i++) if (cart[i].key === item.key) { cart[i].qty += item.qty; saveCart(); renderCart(); return; }
    cart.push(item); saveCart(); renderCart();
  }
  var toastT = 0;
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2200); }

  /* Mobile menu */
  var menu = document.getElementById('mobileMenu'), menuBtn = document.getElementById('menuBtn');
  function closeMenu() { menu.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }

  /* Events */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a');
    if (!t) return;
    if (t.hasAttribute('data-close-cart')) closeCart();
    if (t.dataset.go) { e.preventDefault(); var v = t.dataset.go; go(v === 'home' ? 'home' : 'personalizar', { scroll: t.dataset.scroll, model: t.dataset.model }); return; }
    if (t.dataset.scrollto) { e.preventDefault(); var el = document.getElementById(t.dataset.scrollto); if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); return; }
    if (t.dataset.open && isModel(t.dataset.open)) { go('product', { model: t.dataset.open, color: t.dataset.color || MODELS[t.dataset.open].colors[0].id }); return; }
    if (t.dataset.idx) { state.idx = t.dataset.idx; render('keep'); return; }
    if (t.dataset.colorPick) { state.color = t.dataset.colorPick; render('keep'); return; }
    if (t.dataset.qty) { state.qty = Math.max(1, Math.min(9, state.qty + Number(t.dataset.qty))); document.getElementById('qtyOut').textContent = state.qty; var bn = document.getElementById('buyNow'), pm = MODELS[state.model]; if (bn && pm) bn.href = buyNowHref(pm, pm.colors.filter(function (c) { return c.id === state.color; })[0] || pm.colors[0]); return; }
    if (t.id === 'addBtn') {
      var col = colorOf(state.model, state.color), m = MODELS[state.model];
      addItem({ key: state.model + ':' + col.id, title: m.name + ' ' + col.name, sub: 'Pronta para encomenda', img: col.img, qty: state.qty, price: m.price });
      toast(m.name + ' ' + col.name + ' na sacola'); return;
    }
    if (t.dataset.bmodel) { state.b.model = t.dataset.bmodel; render('keep'); return; }
    if (t.dataset.bcolor) { var cs = state.b.colors, code = t.dataset.bcolor; if (cs.indexOf(code) > -1) state.b.colors = cs.filter(function (x) { return x !== code; }); else if (cs.length < 2) state.b.colors = cs.concat([code]); else state.b.colors = [cs[1], code]; render('keep'); return; }
    if (t.dataset.strap) { state.b.strap = t.dataset.strap === 'yes'; if (!state.b.strap) state.b.strapColor = null; render('keep'); return; }
    if (t.dataset.scolor) { state.b.strapColor = state.b.strapColor === t.dataset.scolor ? null : t.dataset.scolor; render('keep'); return; }
    if (t.id === 'cartBtn') { openCart(); return; }
    if (t.id === 'cartClose') { closeCart(); cartBtn.focus(); return; }
    if (t.dataset.cq) { var q = t.dataset.cq.split(':'), it = cart[+q[0]]; it.qty += +q[1]; if (it.qty < 1) cart.splice(+q[0], 1); saveCart(); renderCart(); return; }
    if (t.dataset.rm) { cart.splice(+t.dataset.rm, 1); saveCart(); renderCart(); return; }
    if (t.id === 'menuBtn') { menu.hidden = false; menuBtn.setAttribute('aria-expanded', 'true'); document.getElementById('menuClose').focus(); return; }
    if (t.id === 'menuClose') { closeMenu(); menuBtn.focus(); return; }
  });
  var cartBtn = document.getElementById('cartBtn');
  scrim.addEventListener('click', closeCart);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (!cartEl.hidden) { closeCart(); cartBtn.focus(); } if (!menu.hidden) closeMenu(); } });

  /* Start on the view named in the link, if any */
  var h = (location.hash || '').replace('#', '');
  renderCart();
  if (isModel(h)) go('product', { model: h, color: MODELS[h].colors[0].id });
  else if (h === 'personalizar') go('personalizar');
  else render(h === 'todos' || h === 'concha' || h === 'modelos' ? h : null);
})();
</script>
